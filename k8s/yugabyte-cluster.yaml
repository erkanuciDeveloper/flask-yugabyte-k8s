apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yugabyte-cluster
spec:
  serviceName: "yugabyte"
  replicas: 3
  selector:
    matchLabels:
      app: yugabyte
  template:
    metadata:
      labels:
        app: yugabyte
    spec:
      containers:
      - name: yb-master
        image: yugabytedb/yugabyte:2.25.2.0-b359
        args: ["bin/yb-master", "--fs_data_dirs=/mnt/data", "--replication_factor=3"]
        ports:
        - containerPort: 7100
        volumeMounts:
        - name: datadir
          mountPath: /mnt/data
      - name: yb-tserver
        image: yugabytedb/yugabyte:2.25.2.0-b359
        args: ["bin/yb-tserver", "--tserver_master_addrs=yugabyte-0.yugabyte:7100,yugabyte-1.yugabyte:7100,yugabyte-2.yugabyte:7100", "--fs_data_dirs=/mnt/data"]
        ports:
        - containerPort: 5433
        volumeMounts:
        - name: datadir
          mountPath: /mnt/data
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: yugabyte
spec:
  clusterIP: None
  selector:
    app: yugabyte
  ports:
    - port: 5433
      targetPort: 5433
