apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-yugabyte-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: erkanuci/flask-yugabyte-k8s:latest
        ports:
        - containerPort: 5000
        env:
        - name: YB_HOST
          value: "yugabyte.default.svc.cluster.local"
        - name: YB_PORT
          value: "5433"
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30010
